version: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payload-plugins-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload_testing
    ports:
      - '5433:5432'
    volumes:
      - payload_pg_data:/var/lib/postgresql/data

volumes:
  payload_pg_data:

